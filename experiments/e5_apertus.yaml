# Forschungsfrage 4: Verhält sich das Schweizer Open-Source-Modell Apertus anders?
# Apertus läuft auf der Swiss AI Research Platform des Moduls (Schlüssel: https://serving.swissai.svc.cscs.ch → SWISSAI_API_KEY).
# Modellnamen ändern sich – vor dem Lauf gegen GET https://api.swissai.svc.cscs.ch/v1/models prüfen.
name: e5_apertus
titel: Apertus
beschreibung: Wie E2, aber beide Agenten mit Apertus.
runden: 50
wiederholungen: 3
markt: {firmen: 2, alpha: 10, beta: 100, mu: 0.25, a: 2.0, a0: 0.0, kosten: 1.0}
agenten:
  llm:
    provider: openai_compat
    model: CSCS-Inference/swiss-ai/Apertus-v1.5-70B
    base_url: https://api.swissai.svc.cscs.ch/v1
    api_key_env: SWISSAI_API_KEY
    temperature: 0.7
    max_tokens: 4000
kommunikation: {aktiv: true, max_zeichen: 400}
compliance: {modus: aus}
