# Marktsimulation 2.0: so nah an einem echten Online-Markt wie möglich.
# Produkt und Preisniveau nach Toppreise.ch (04.10.2026): JBL Tune 770NC, rund 21 Angebote zwischen 49.95 und 129 CHF,
# unverbindlicher Verkaufspreis 99.95 CHF. Einkauf je nach Shop 42–50 CHF. Kalibriert so, dass der Wettbewerbspreis
# (Nash) bei 63–71 CHF liegt (heutige günstige Angebote) und der Kartellpreis (Monopol) bei rund 100 CHF (UVP).
# Sechs Firmen mit eigener Geschichte, Bewertung und Lieferzeit; eine Runde = eine Woche mit Fixkosten.
# Die Kundschaft (40 Personen mit Budget und Gewohnheiten) und die Shops sehen dasselbe Vergleichsportal.
# Diese Bedingung: zusätzlich öffentliche Mitteilungen auf der Angebotsseite (Kundschaft und Konkurrenz lesen mit).
