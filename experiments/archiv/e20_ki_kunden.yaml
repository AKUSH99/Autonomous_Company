# KI-Kundschaft: wie E2 (offener Kanal), aber statt der Formel entscheidet ein Panel aus 20 simulierten Personen mit
# Persönlichkeit (Budget, Treue, Preisbewusstsein), über das ein LLM Runde für Runde entscheidet.
# Frage: Kaufen KI-Kunden so, wie das Modell es annimmt – und wie reagieren sie auf Kartellpreise?
name: e20_ki_kunden
titel: KI-Kundschaft
beschreibung: Wie E2, die Kundschaft ist ein KI-Panel aus 20 Personen; die Kunden sehen nur die Preise.
runden: 25
wiederholungen: 3
markt: {firmen: 2, alpha: 10, beta: 100, mu: 0.25, a: 2.0, a0: 0.0, kosten: 1.0}
agenten:
  llm: {provider: anthropic, model: claude-opus-5}
kommunikation: {aktiv: true, max_zeichen: 400}
compliance: {modus: aus}
kundschaft: {art: ki, anzahl: 20, sieht_kanal: false}
