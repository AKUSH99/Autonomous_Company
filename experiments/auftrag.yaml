# Auftrag für GitHub Actions (.github/workflows/experimente.yml).
# Wird diese Datei auf GitHub geändert, arbeitet der Workflow die Läufe ab und legt die Ergebnisse
# im Branch "ergebnisse" ab. Lokal: python -m kartell auftrag experiments/auftrag.yaml
#
# Aktuell (30.09., Auftrag B, wartet hinter Auftrag A): KI-Kundschaft, Nemotron 3 Ultra, Gratismodell – kostet nichts.
#   E22 w2: Budget als Betrag (zweiter Durchgang) · E21 w3: Kundschaft liest den Kanal mit · E20 w3: nur Preise
# Reicht das Tageskontingent (1000 Anfragen) nicht, bricht der Lauf sauber ab (Modellausfall); der Rest folgt am 1.10.
denken: standard
zeitlimit_min: 100
laeufe:
  - {config: experiments/e22_ki_kunden_budget_in_chf.yaml, modell: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free", runden: 25, wiederholungen: 1, erste_wiederholung: 2}
  - {config: experiments/e21_ki_kunden_sehen_kanal.yaml, modell: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free", runden: 25, wiederholungen: 1, erste_wiederholung: 3}
  - {config: experiments/e20_ki_kunden.yaml, modell: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free", runden: 25, wiederholungen: 1, erste_wiederholung: 3}
