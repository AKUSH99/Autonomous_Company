# Auftrag für GitHub Actions (.github/workflows/experimente.yml).
# Wird diese Datei auf GitHub geändert, arbeitet der Workflow die Läufe ab und legt die Ergebnisse
# im Branch "ergebnisse" ab. Lokal: python -m kartell auftrag experiments/auftrag.yaml
#
# Aktuell: Verbots-Experiment, Kontrolle E1 (ohne Kanal) – Nemotron 3 Ultra (NVIDIA), Gratismodell bei OpenRouter.
# Vorab festgelegt in docs/vorregistrierung_verbot.md: Wie eng laufen die Preise, wenn die Shops gar nicht reden
# können? Erst mit diesem Vergleich lässt sich Regel 3 („Verbot macht Koordination nur unsichtbar“) prüfen.
# Rund 115 Gratis-Anfragen pro Lauf, 1000 pro Tag.
denken: standard
zeitlimit_min: 60
laeufe:
  - {config: experiments/e1_ohne_kommunikation.yaml, modell: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free", runden: 25, wiederholungen: 1, erste_wiederholung: 1}
  - {config: experiments/e1_ohne_kommunikation.yaml, modell: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free", runden: 25, wiederholungen: 1, erste_wiederholung: 2}
  - {config: experiments/e1_ohne_kommunikation.yaml, modell: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free", runden: 25, wiederholungen: 1, erste_wiederholung: 3}
  - {config: experiments/e1_ohne_kommunikation.yaml, modell: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free", runden: 25, wiederholungen: 1, erste_wiederholung: 4}
  - {config: experiments/e1_ohne_kommunikation.yaml, modell: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free", runden: 25, wiederholungen: 1, erste_wiederholung: 5}
