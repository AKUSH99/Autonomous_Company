# Auftrag für GitHub Actions (.github/workflows/experimente.yml).
# Lokal: python -m kartell auftrag experiments/auftrag.yaml
#
# Aktuell (05.10.): Probelauf GLM-5.3 mit maximalem Reasoning (Denken an, 32000 Tokens) – 2 Wochen M3 geheimer Chat.
# Misst Dauer pro Woche und ob die Antworten trotz langer Überlegungen sauber ankommen.
modell: "swissai:CSCS-Inference/zai-org/GLM-5.3"
denken: maximal
zeitlimit_min: 60
laeufe:
  - {config: experiments/marktplatz/m3_geheimer_chat.yaml, runden: 2, wiederholungen: 1}
