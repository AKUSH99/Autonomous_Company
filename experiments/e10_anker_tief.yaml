# Ankereffekt-Test: gleiches Spiel wie E1, aber Kosten 3 CHF statt 10 CHF (Qualität entsprechend verschoben).
# Gewinne und Aufschläge sind identisch zu E1; nur das Preisniveau wandert. Der Anker "doppelte Kosten" (6 CHF)
# liegt hier UNTER dem Wettbewerbspreis. Folgen die Agenten dem Anker, fällt der Kollusionsindex unter 0.
name: e10_anker_tief
beschreibung: Wie E1 (kein Kanal), Stückkosten 3 CHF – Anker unter dem Wettbewerbspreis.
runden: 50
wiederholungen: 3
markt: {firmen: 2, alpha: 10, beta: 100, mu: 0.25, a: 1.3, a0: 0.0, kosten: 0.3}
agenten:
  llm: {provider: anthropic, model: claude-opus-5}
kommunikation: {aktiv: false}
compliance: {modus: aus}
