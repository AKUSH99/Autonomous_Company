[project]
name = "studienassistent"
version = "0.1.0"
description = "FHNW-Studienassistent: ein LLM-Agent (LangGraph) beantwortet Fragen zu Modulen, Fristen und Regeln – mit Quellenangabe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pypdf>=5.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8.0", "mcp>=2.2,<3", "streamlit>=1.50"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studienassistent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
