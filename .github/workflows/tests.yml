# Automatische Tests bei jedem Push und Pull Request – ohne API-Schlüssel, ohne Kosten.
# Alle Tests laufen offline: ein simuliertes Sprachmodell statt echter Aufrufe, kleine Beispieldokumente statt Kursunterlagen.
name: Tests

# Push auf main und jeder Pull Request (Branches mit offenem PR laufen so nur einmal pro Push).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Befehlszeile ohne Netz (Einlesen der Beispieldokumente, Suche ohne Sprachmodell)
        env:
          STUDIENASSISTENT_DATEN: ${{ runner.temp }}/daten
        run: |
          python -m studienassistent einlesen tests/daten
          python -m studienassistent bewerten --nur-suche --testset evaluation/fragen.jsonl
