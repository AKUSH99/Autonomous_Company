# Führt die Läufe aus experiments/auftrag.yaml auf GitHub aus – ohne eigenen Rechner.
# Start: auftrag.yaml ändern und pushen, oder unter "Actions" → "Experimente" → "Run workflow".
# Wird ein Pull Request nach main übernommen, startet kein zweiter, gleicher Lauf (der lief schon auf dem Arbeitszweig).
# Schlüssel: Repository-Secrets DEEPSEEK_API_KEY, OPENROUTER_API_KEY, SWISSAI_API_KEY, LITELLM_API_KEY und/oder ANTHROPIC_API_KEY unter
# Settings → Secrets and variables → Actions. Ergebnisse landen im Branch "ergebnisse" unter laeufe/.
name: Experimente

on:
  push:
    branches-ignore: [ergebnisse]
    paths: [experiments/auftrag.yaml]
  workflow_dispatch:

permissions:
  contents: write

# Übernahmen nach main (Merge-Commits) bekommen je eine eigene Gruppe. Sonst würde ihr leerer Lauf einen wartenden
# echten Lauf abbrechen: GitHub bricht in einer Gruppe den älteren WARTENDEN Lauf ab, sobald ein neuer dazukommt.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
    (startsWith(github.event.head_commit.message, 'Merge pull request') || contains(github.event.head_commit.message, '(#')) &&
    format('uebernahme-{0}', github.run_id) || 'experimente' }}
  cancel-in-progress: false

jobs:
  schluessel:
    if: >-
      github.event_name != 'push' || github.ref != 'refs/heads/main' ||
      !(startsWith(github.event.head_commit.message, 'Merge pull request') || contains(github.event.head_commit.message, '(#'))
    runs-on: ubuntu-latest
    outputs:
      vorhanden: ${{ steps.pruefen.outputs.vorhanden }}
    steps:
      - id: pruefen
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SWISSAI_API_KEY: ${{ secrets.SWISSAI_API_KEY || secrets.SWISSAIKEY }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY$OPENROUTER_API_KEY$ANTHROPIC_API_KEY$SWISSAI_API_KEY$LITELLM_API_KEY" ]; then
            echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Kein API-Schlüssel hinterlegt (Secret DEEPSEEK_API_KEY, OPENROUTER_API_KEY, SWISSAI_API_KEY, LITELLM_API_KEY oder ANTHROPIC_API_KEY) – Lauf übersprungen."
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
          fi

  lauf:
    needs: schluessel
    if: needs.schluessel.outputs.vorhanden == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SWISSAI_API_KEY: ${{ secrets.SWISSAI_API_KEY || secrets.SWISSAIKEY }}
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
      # Tracing mit LangSmith, sobald das Secret LANGSMITH_API_KEY (oder LANGSMITH) existiert
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY || secrets.LANGSMITH }}
      LANGSMITH_TRACING: ${{ (secrets.LANGSMITH_API_KEY || secrets.LANGSMITH) != '' }}
      LANGSMITH_PROJECT: ki-kartell
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[analyse,mcp]"

      # Der OpenRouter-Schlüssel wird auch gefunden, wenn das Secret anders heisst (z. B. OPENROUTER_KEY) oder
      # versehentlich als Variable statt als Secret angelegt wurde. Ins Protokoll kommen nur NAMEN, nie Werte.
      - name: OpenRouter-Schlüssel suchen
        shell: bash
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python - <<'PY'
          import json, os
          secrets = json.loads(os.environ.get("SECRETS_JSON") or "{}")
          variablen = json.loads(os.environ.get("VARS_JSON") or "{}")
          secrets.pop("github_token", None)
          print("Repository-Secrets (nur Namen):", ", ".join(sorted(secrets)) or "keine")
          print("Repository-Variablen (nur Namen):", ", ".join(sorted(variablen)) or "keine")
          kandidaten = [("Secret", n, secrets[n]) for n in sorted(secrets, key=lambda n: n != "OPENROUTER_API_KEY") if "ROUTER" in n.upper()]
          kandidaten += [("Variable", n, variablen[n]) for n in sorted(variablen) if "ROUTER" in n.upper()]
          kandidaten = [k for k in kandidaten if str(k[2]).strip()]
          if not kandidaten:
              print("::warning::Kein Secret und keine Variable mit ROUTER im Namen gefunden. Unter Settings → Secrets and variables → "
                    "Actions → Reiter 'Secrets' → 'New repository secret' mit dem Namen OPENROUTER_API_KEY anlegen.")
          else:
              art, name, wert = kandidaten[0]
              wert = str(wert).strip()
              print(f"::add-mask::{wert}")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"OPENROUTER_API_KEY={wert}\n")
              form = "Format passt (sk-or-…)" if wert.startswith("sk-or-") else "Format passt NICHT zu OpenRouter (sollte mit sk-or- beginnen)"
              print(f"OpenRouter-Schlüssel gefunden: {art} {name}, Länge {len(wert)}, {form}")
              if art == "Variable":
                  print("::warning::Der Schlüssel liegt als Variable vor – Variablen sind nicht geheim. Bitte als Secret anlegen und die Variable löschen.")
          PY

      - name: Auftrag abarbeiten
        shell: bash
        run: python -m kartell auftrag experiments/auftrag.yaml 2>&1 | tee protokoll.txt

      - name: Ergebnisse im Branch "ergebnisse" sichern
        if: always()
        shell: bash
        run: |
          ziel="laeufe/$(date -u +%Y%m%d-%H%M)_lauf${GITHUB_RUN_NUMBER}"
          mkdir -p "$RUNNER_TEMP/out"
          for f in runs reports protokoll.txt experiments/auftrag.yaml; do [ -e "$f" ] && cp -r "$f" "$RUNNER_TEMP/out/"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clean -fdxq
          if git fetch --depth 1 origin ergebnisse; then
            git checkout -q -B ergebnisse FETCH_HEAD
          else
            git checkout -q --orphan ergebnisse && git rm -rfq .
            printf '# Ergebnisse\n\nAutomatisch erzeugt vom Workflow "Experimente". Jeder Ordner in laeufe/ ist ein Auftrag.\n' > LIESMICH.md
          fi
          mkdir -p "$ziel" && cp -r "$RUNNER_TEMP/out/." "$ziel/"
          git add -A
          git commit -qm "Ergebnisse ${ziel#laeufe/} (${GITHUB_SHA::7})"
          git push -q origin ergebnisse
          echo "Ergebnisse gesichert: Branch ergebnisse, Ordner $ziel"
