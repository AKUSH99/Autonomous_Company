# Szenario-Labor: ein eigenes Szenario rechnen – ohne eigenen Rechner.
# Start: Actions → «Szenario starten» → «Run workflow», den Szenario-Code aus der Seite «Szenario-Labor» einfügen.
# Läufe auf der Swiss AI Platform teilen sich ein Ratenlimit (~15 Anfragen/Minute): darum dieselbe Warteschlange wie
# die Experimente – ein Szenario startet erst, wenn der vorherige Lauf fertig ist.
# Ergebnisse: Branch «ergebnisse», Ordner szenarien/<Datum>_<Name>/ mit den Lauf-Daten und marktplatz.html.
name: Szenario starten

on:
  workflow_dispatch:
    inputs:
      szenario:
        description: "Szenario-Code (JSON) aus der Seite «Szenario-Labor»"
        required: true
      modell:
        description: "Modell"
        type: choice
        default: "swissai:RCP-AIaaS/deepseek-ai/DeepSeek-V4.1-Flash"
        options:
          - "swissai:RCP-AIaaS/deepseek-ai/DeepSeek-V4.1-Flash"
          - "swissai:CSCS-Inference/zai-org/GLM-5.3"
          - "apertus"
      denken:
        description: "Reasoning"
        type: choice
        default: "aus"
        options: ["aus", "maximal"]

permissions:
  contents: write

concurrency:
  group: experimente
  cancel-in-progress: false

jobs:
  szenario:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SWISSAI_API_KEY: ${{ secrets.SWISSAI_API_KEY || secrets.SWISSAIKEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY || secrets.LANGSMITH }}
      LANGSMITH_TRACING: ${{ (secrets.LANGSMITH_API_KEY || secrets.LANGSMITH) != '' }}
      LANGSMITH_PROJECT: ki-kartell
      PYTHONUNBUFFERED: "1"
      SZENARIO: ${{ inputs.szenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[analyse,mcp]"
      - name: Szenario prüfen
        run: python -c "import os; from kartell.szenario import lade_szenario; s = lade_szenario(os.environ['SZENARIO']); print(s.name, '·', s.als_config().beschreibung)"
      - name: Szenario rechnen
        run: python -m kartell szenario "$SZENARIO" --modell "${{ inputs.modell }}" --denken "${{ inputs.denken }}" 2>&1 | tee protokoll.txt
      - name: Marktplatz-Ansicht
        if: always()
        run: python -m kartell marktplatz runs/ --ausgabe reports/marktplatz.html || true
      - name: Ergebnisse im Branch «ergebnisse» sichern
        if: always()
        shell: bash
        run: |
          name=$(python -c "import os; from kartell.szenario import lade_szenario; print(lade_szenario(os.environ['SZENARIO']).kurzname)" 2>/dev/null || echo szenario)
          ziel="szenarien/$(date -u +%Y%m%d-%H%M)_${name}"
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s\n' "$SZENARIO" > "$RUNNER_TEMP/out/szenario.json"
          for f in runs reports protokoll.txt; do [ -e "$f" ] && cp -r "$f" "$RUNNER_TEMP/out/"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clean -fdxq
          git fetch --depth 1 origin ergebnisse && git checkout -q -B ergebnisse FETCH_HEAD
          mkdir -p "$ziel" && cp -r "$RUNNER_TEMP/out/." "$ziel/"
          git add -A
          git commit -qm "Szenario ${ziel#szenarien/} (${GITHUB_SHA::7})"
          git push -q origin ergebnisse
          echo "### Ergebnis: \`$ziel\` im Branch «ergebnisse»" >> "$GITHUB_STEP_SUMMARY"
